<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 296" width="240" height="296" role="img" aria-labelledby="t">
  <title id="t">Illustration of a table tennis bat hitting a ball over the net</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a33"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11475a"/>
      <stop offset="1" stop-color="#0a2b37"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset=".6" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e5781c"/>
    </radialGradient>
    <linearGradient id="rub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#b3140f"/>
    </linearGradient>
  </defs>
  <rect width="240" height="296" fill="url(#bg)"/>
  <!-- table in perspective -->
  <polygon points="28,204 212,204 240,296 0,296" fill="url(#tbl)"/>
  <polygon points="28,204 212,204 240,296 0,296" fill="none" stroke="#e8f6f7" stroke-opacity=".75" stroke-width="2"/>
  <line x1="120" y1="204" x2="120" y2="296" stroke="#e8f6f7" stroke-opacity=".45" stroke-width="1.5"/>
  <!-- net -->
  <rect x="22" y="188" width="196" height="16" fill="#e8f6f7" fill-opacity=".08"/>
  <g stroke="#e8f6f7" stroke-opacity=".25" stroke-width="1">
    <path d="M22 192H218M22 196H218M22 200H218"/>
    <path d="M40 188V204M60 188V204M80 188V204M100 188V204M120 188V204M140 188V204M160 188V204M180 188V204M200 188V204"/>
  </g>
  <rect x="22" y="186" width="196" height="3" rx="1.5" fill="#e8f6f7" fill-opacity=".9"/>
  <!-- ball trail -->
  <path d="M40 150 Q 96 70 150 104" fill="none" stroke="#ffb347" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <circle cx="150" cy="104" r="11" fill="url(#ball)"/>
  <!-- bat -->
  <g transform="rotate(-32 168 150)">
    <rect x="160" y="168" width="16" height="58" rx="6" fill="#8a5a33"/>
    <rect x="160" y="168" width="16" height="58" rx="6" fill="none" stroke="#5b3a1f" stroke-width="2"/>
    <path d="M163 178H173M163 190H173M163 202H173" stroke="#5b3a1f" stroke-opacity=".6" stroke-width="1.5"/>
    <ellipse cx="168" cy="138" rx="38" ry="42" fill="#1a1a1a"/>
    <ellipse cx="168" cy="136" rx="35" ry="39" fill="url(#rub)"/>
    <ellipse cx="158" cy="122" rx="12" ry="8" fill="#fff" fill-opacity=".12"/>
  </g>
  <!-- motion lines -->
  <g stroke="#5ee6eb" stroke-opacity=".5" stroke-width="2" stroke-linecap="round">
    <path d="M208 78l14-8M212 96l18-2M206 60l10-12"/>
  </g>
</svg>
